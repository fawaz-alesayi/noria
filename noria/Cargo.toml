[package]
name = "noria"
version = "0.7.0"
edition = "2024"
authors = ["The Noria developers <noria@pdos.csail.mit.edu>"]
license = "MIT OR Apache-2.0"

readme = "README.md"
description = "Core data types for Noria"
repository = "https://github.com/mit-pdos/noria.git"
homepage = "https://pdos.csail.mit.edu/noria"

keywords = ["database", "dataflow", "backend", "storage", "sql"]
categories = ["api-bindings", "database"]

[badges]
azure-devops = { project = "mit-pdos/mit-pdos", pipeline = "noria", build = "1" }
maintenance = { status = "experimental" }

[dependencies]
ahash = "0.8"
arccstr = "1.3"
chrono = { version = "0.4.38", features = ["serde"] }
failure = "0.1.8"
mysql_common = "0.35.5"
nom-sql = "0.0.11"
petgraph = { version = "0.8", features = ["serde-1"] }
serde = { version = "1.0", features = ["rc"] }
serde_derive = "1.0"
serde_json = "1.0"

[dev-dependencies]
assert_approx_eq = "1.1.0"

[lib]
path = "src/lib.rs"
name = "noria"
