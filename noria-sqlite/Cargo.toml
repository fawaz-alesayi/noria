[package]
name = "noria-sqlite"
version = "0.1.0"
edition = "2021"
authors = ["Noria SQLite Contributors"]
license = "MIT OR Apache-2.0"
description = "Transparent caching layer for SQLite using Noria's dataflow engine"
repository = "https://github.com/mit-pdos/noria.git"
keywords = ["database", "sqlite", "cache", "dataflow"]
categories = ["database", "caching"]

[features]
default = []
# Enable bundled SQLite with session extension support
bundled = ["rusqlite/bundled"]

[dependencies]
# SQLite bindings with session extension support
rusqlite = { version = "0.32.1", features = ["session", "bundled"] }

# Noria core (for DataType, etc.)
noria = { path = "../noria" }

# Lock-free concurrent map for view storage
evmap = "11.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

# Hashing
ahash = "0.8"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Parking lot for efficient synchronization primitives
parking_lot = "0.12"

# Date/time (same version as noria uses)
chrono = "0.4"

[dev-dependencies]
# Testing utilities
tempfile = "3.0"
criterion = "0.5"

[[test]]
name = "integration"
path = "tests/integration.rs"
